name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    env:
      API_URL: http://localhost:88/api
      API_ORIGIN: http://localhost:88
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scan repository for secrets
        run: bun run secrets:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Production build
        run: bun run build

  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore FA23_Convocation2023_API.sln

      - name: Build
        run: dotnet build FA23_Convocation2023_API.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FA23_Convocation2023_API.sln --configuration Release --no-build

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    env:
      DB_PASSWORD: ci-only-password-not-used-at-runtime
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-only-secret-not-used-at-runtime
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build be fe
