x-postgres-url: &postgres-url postgresql://convocation:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment secret store}@be-nest-postgres:5432/convocation_migration

# MinIO is owned by the existing cloud "convocation" stack; reuse its root credentials.
x-minio-credentials: &minio-credentials
  MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY to the shared MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY to the shared MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET:-convocation}

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: convocation_migration
      POSTGRES_USER: convocation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U convocation -d convocation_migration']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default:
        # The shared network already has a "postgres" host; use an unambiguous name.
        aliases:
          - be-nest-postgres

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        i=0
        until mc alias set shared http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          i=$$((i + 1))
          if [ "$$i" -ge 30 ]; then
            echo "Could not reach the shared MinIO" >&2
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing "shared/$${S3_BUCKET}"
        # Public links: anyone may read one object in library/ by its exact random key.
        # Listing the bucket and every other prefix stay private.
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/library/*"]}]}' "$${S3_BUCKET}" > /tmp/public-library.json
        mc anonymous set-json /tmp/public-library.json "shared/$${S3_BUCKET}"
    environment: *minio-credentials
    restart: 'no'
    networks:
      - shared

  be-nest-migrate:
    build:
      context: ./be-nest
      dockerfile: Dockerfile
      target: migration
    environment:
      DATABASE_URL: *postgres-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  be-nest:
    build:
      context: ./be-nest
      dockerfile: Dockerfile
      target: runtime
    ports:
      - '127.0.0.1:8081:8081'
    environment:
      NODE_ENV: ${BE_NEST_NODE_ENV:-production}
      PORT: '8081'
      DATABASE_URL: *postgres-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in the deployment secret store}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8081}
      TRUSTED_ORIGINS: ${APP_ORIGIN:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:19000}
      S3_BUCKET: ${S3_BUCKET:-convocation}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.com}
      ALLOW_DATABASE_RESET: 'false'
    depends_on:
      be-nest-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8081/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default
      - shared

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        API_URL: http://be-nest:8081/api
        API_ORIGIN: http://be-nest:8081
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      API_URL: http://be-nest:8081/api
      API_ORIGIN: http://be-nest:8081
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
    depends_on:
      be-nest:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Network created by the cloud "convocation" stack (project name + "_convocation").
  shared:
    external: true
    name: ${SHARED_NETWORK:-convocation_convocation}

volumes:
  postgres_data:
